<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CyberMahjong">
    <title>麻将 (Mahjong) - iPad 赛博豪华典藏版</title>

    <!-- Tailwind CSS, Google Fonts, React 18, Babel CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        html, body {
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background-color: #050811;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", sans-serif;
        }

        #root {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .safe-top-padding {
            padding-top: max(env(safe-area-inset-top), 8px);
        }

        .font-orbitron {
            font-family: 'Orbitron', monospace;
        }
        .font-heiti {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", sans-serif;
            font-weight: 800;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(10, 16, 30, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e3a5f;
            border-radius: 4px;
        }

        /* 赛博深空量子战术底桌 */
        .cyber-table-felt {
            background-color: #070d1a;
            background-image: 
                radial-gradient(ellipse at 50% 50%, rgba(14, 53, 90, 0.45) 0%, rgba(4, 8, 16, 0.95) 80%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 28px 28px, 28px 28px;
        }

        /* 纳米骨瓷 3D 麻将牌块（严格 1:1.44 纵横比，骨瓷质感与冰蓝极光底座） */
        .mj-tile-nano {
            background: linear-gradient(170deg, #ffffff 0%, #f8fafc 55%, #e2e8f0 100%);
            border-radius: 6px;
            box-shadow: 
                0 1px 0 rgba(255, 255, 255, 0.95) inset,
                0 -2px 0 rgba(15, 23, 42, 0.35) inset,
                -1px 0 0 rgba(255, 255, 255, 0.7) inset,
                1px 0 0 rgba(15, 23, 42, 0.2) inset,
                0 8px 16px -2px rgba(0, 0, 0, 0.75),
                0 4px 6px -1px rgba(0, 0, 0, 0.45);
            border: 1px solid #94a3b8;
            position: relative;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.3, 1), box-shadow 0.15s ease-out;
        }

        .mj-tile-nano::after {
            content: "";
            position: absolute;
            bottom: -3px;
            left: 1px;
            right: 1px;
            height: 3px;
            background: linear-gradient(90deg, #0284c7 0%, #00f0ff 50%, #0369a1 100%);
            border-radius: 0 0 5px 5px;
            border-bottom: 1px solid #082f49;
        }

        .mj-tile-selected {
            transform: translateY(-16px) scale(1.05);
            box-shadow: 
                0 0 0 2px #00f0ff,
                0 0 24px rgba(0, 240, 255, 0.75),
                0 14px 28px -4px rgba(0, 0, 0, 0.85);
            z-index: 30;
        }

        .mj-tile-nano:active {
            transform: translateY(-4px) scale(0.98);
        }

        .mj-tile-back-cyber {
            background: linear-gradient(145deg, #0c2038 0%, #05101d 60%, #02070e 100%);
            border: 1px solid #0284c7;
            box-shadow: 
                0 1px 0 rgba(0, 240, 255, 0.4) inset,
                0 4px 8px rgba(0, 0, 0, 0.7);
            border-radius: 5px;
        }

        /* 侧边玩家横向卧倒麻将牌 (90度旋转省空间形态) */
        .mj-tile-side-horizontal {
            width: 26px;
            height: 17px;
            background: linear-gradient(180deg, #0c223c 0%, #061324 70%, #020813 100%);
            border: 1px solid #0284c7;
            border-radius: 3px;
            box-shadow: 
                0 1px 0 rgba(0, 240, 255, 0.3) inset,
                0 2px 4px rgba(0, 0, 0, 0.6);
            position: relative;
        }
        .mj-tile-side-horizontal::after {
            content: "";
            position: absolute;
            right: -2px;
            top: 1px;
            bottom: 1px;
            width: 2px;
            background: #00f0ff;
            border-radius: 0 2px 2px 0;
            opacity: 0.7;
        }

        .quantum-compass {
            background: radial-gradient(circle at 50% 50%, #0d1e33 0%, #060e19 100%);
            border: 2px solid rgba(0, 240, 255, 0.45);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25), 0 0 12px rgba(0, 0, 0, 0.8) inset;
        }

        @keyframes cyberPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px #00f0ffaa); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 20px #ff0077dd); }
        }
        .cyber-action-pulse {
            animation: cyberPulse 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }
        .animate-float {
            animation: floatSlow 4s ease-in-out infinite;
        }

        .text-glow-cyan {
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 240, 255, 0.4);
        }
    </style>
</head>
<body class="bg-[#050811] text-cyan-50 select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        class CyberMahjongSFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTileClick() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1400, now);
                    osc.frequency.exponentialRampToValueAtTime(360, now + 0.04);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } catch(e) {}
            }
            playDiscard() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
                    gain.gain.setValueAtTime(0.38, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } catch(e) {}
            }
            playDraw() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.linearRampToValueAtTime(880, now + 0.06);
                    gain.gain.setValueAtTime(0.16, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } catch(e) {}
            }
            playMeldAction() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    [587.33, 880, 1174.66].forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.04);
                        gain.gain.setValueAtTime(0.18, now + idx * 0.04);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.04 + 0.08);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.04);
                        osc.stop(now + idx * 0.04 + 0.08);
                    });
                } catch(e) {}
            }
            playVictoryHu() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const chord = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                    chord.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + i * 0.07);
                        gain.gain.setValueAtTime(0.28, now + i * 0.07);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.6);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + i * 0.07);
                        osc.stop(now + i * 0.07 + 0.6);
                    });
                } catch(e) {}
            }
        }
        const sfx = new CyberMahjongSFX();

        const IconBase = ({ children, size = 20, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Cpu = (p) => <IconBase {...p}><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><line x1="9" y1="1" x2="9" y2="4" /><line x1="15" y1="1" x2="15" y2="4" /><line x1="9" y1="20" x2="9" y2="23" /><line x1="15" y1="20" x2="15" y2="23" /><line x1="20" y1="9" x2="23" y2="9" /><line x1="20" y1="14" x2="23" y2="14" /><line x1="1" y1="9" x2="4" y2="9" /><line x1="1" y1="14" x2="4" y2="14" /></IconBase>;
        const Zap = (p) => <IconBase {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></IconBase>;
        const BookOpen = (p) => <IconBase {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></IconBase>;
        const XIcon = (p) => <IconBase {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></IconBase>;
        const MessageSquare = (p) => <IconBase {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></IconBase>;
        const HomeIcon = (p) => <IconBase {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></IconBase>;
        const Sparkles = (p) => <IconBase {...p}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275-1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /></IconBase>;
        const Lightbulb = (p) => <IconBase {...p}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></IconBase>;
        const Trophy = (p) => <IconBase {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" /></IconBase>;

        const ArcReactorSVG = ({ size = "md" }) => {
            const dim = size === 'sm' ? 22 : size === 'lg' ? 44 : 30;
            return (
                <svg width={dim} height={dim} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" className="shrink-0 select-none">
                    <circle cx="32" cy="32" r="30" stroke="#00f0ff" strokeWidth="1.5" strokeDasharray="4 2" />
                    <circle cx="32" cy="32" r="26" stroke="#0284c7" strokeWidth="3" fill="#061220" />
                    {Array.from({ length: 8 }).map((_, i) => (
                        <rect 
                            key={i} 
                            x="30" y="8" width="4" height="7" rx="1.5" 
                            fill="#f59e0b" 
                            stroke="#ffffff"
                            strokeWidth="0.6"
                            transform={`rotate(${i * 45} 32 32)`}
                        />
                    ))}
                    <circle cx="32" cy="32" r="16" stroke="#f43f5e" strokeWidth="2.5" fill="#0b1728" />
                    <circle cx="32" cy="32" r="10" fill="#0284c7" />
                    <circle cx="32" cy="32" r="6" fill="#ffffff" filter="drop-shadow(0 0 5px #00f0ff)" />
                </svg>
            );
        };

        const CHINESE_NUMS = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
        const ZI_NAMES = ["", "东", "南", "西", "北", "中", "发", "白"];
        const ZI_ENGLISH = { 东: "EAST", 南: "SOUTH", 西: "WEST", 北: "NORTH", 中: "CORE", 发: "QUANTUM", 白: "" };

        // 统一图案区域容器（比文字牌大，限定舒适比例显示框，确保条和筒均匀分布）
        const PatternBox = ({ size = "md", children }) => {
            const boxDims = {
                sm: "w-[20px] h-[28px]",
                river: "w-[24px] h-[33px] sm:w-[27px] sm:h-[37px]",
                md: "w-[28px] h-[38px] sm:w-[30px] sm:h-[42px]",
                lg: "w-[36px] h-[50px] sm:w-[40px] sm:h-[56px]",
            }[size] || "w-[28px] h-[38px]";

            return (
                <div className={`${boxDims} flex items-center justify-center select-none mx-auto my-auto relative`}>
                    {children}
                </div>
            );
        };

        // 极简纯黑圆角倒角线条（条/索专用：线宽稳定统一，两端饱满圆角倒角，带激光微光描边）
        const MinimalLine = ({ size = "md", length = "standard", extraClass = "" }) => {
            const widthClass = {
                sm: "w-[2.2px]",
                river: "w-[2.8px] sm:w-[3px]",
                md: "w-[3.2px]",
                lg: "w-[3.8px]",
            }[size] || "w-[3.2px]";

            // 精准像素阶梯高度，彻底避免 flex 容器中百分比高度折叠失效为横向虚影的 Bug
            const heightClass = {
                long: { sm: "h-[15px]", river: "h-[18px] sm:h-[20px]", md: "h-[22px]", lg: "h-[26px]" }[size] || "h-[22px]",
                standard: { sm: "h-[8.5px]", river: "h-[10px] sm:h-[11.5px]", md: "h-[12px]", lg: "h-[14px]" }[size] || "h-[12px]",
                short: { sm: "h-[6px]", river: "h-[7px] sm:h-[8px]", md: "h-[8.5px]", lg: "h-[10px]" }[size] || "h-[8.5px]",
            }[length] || ({ sm: "h-[8.5px]", river: "h-[10px] sm:h-[11.5px]", md: "h-[12px]", lg: "h-[14px]" }[size] || "h-[12px]");

            return (
                <div 
                    className={`${widthClass} ${heightClass} rounded-full shrink-0 select-none bg-slate-950 ${extraClass}`}
                    style={{
                        boxShadow: '0 0 0 0.6px rgba(0, 240, 255, 0.4), inset 0 0 1px rgba(255, 255, 255, 0.3)'
                    }}
                />
            );
        };

        // 极简纯黑实心小圆圈（筒/饼专用：紧凑小巧，带全息激光微光描边）
        const MinimalCircle = ({ size = "md", extraClass = "" }) => {
            const sizePx = {
                sm: "w-[3.6px] h-[3.6px]",
                river: "w-[4.4px] h-[4.4px] sm:w-[4.9px] sm:h-[4.9px]",
                md: "w-[4.8px] h-[4.8px] sm:w-[5.2px] sm:h-[5.2px]",
                lg: "w-[6.2px] h-[6.2px] sm:w-[7px] sm:h-[7px]",
            }[size] || "w-[4.8px] h-[4.8px]";

            return (
                <div 
                    className={`rounded-full shrink-0 bg-slate-950 flex items-center justify-center select-none ${sizePx} ${extraClass}`}
                    style={{
                        boxShadow: '0 0 0 0.8px rgba(0, 240, 255, 0.85), 0 0 3px rgba(0, 240, 255, 0.55), inset 0 0 1px rgba(255, 255, 255, 0.3)'
                    }}
                />
            );
        };

        // 万字牌：严格按照风牌标准比例，所有数字统一纯黑（五万不特殊），英文代号采用赤红激光荧光
        const WanTileView = ({ val, size = "md" }) => {
            const fontNumSize = {
                sm: "text-sm",
                river: "text-base sm:text-lg",
                md: "text-2xl",
                lg: "text-3xl",
            }[size] || "text-2xl";

            const englishTag = `${val} WAN`;

            return (
                <div className="flex flex-col items-center justify-center leading-none select-none">
                    <span className={`font-heiti font-black text-slate-950 leading-none ${fontNumSize}`}>
                        {CHINESE_NUMS[val]}
                    </span>
                    <span 
                        className="text-[6px] sm:text-[7px] font-orbitron font-extrabold tracking-wider leading-none mt-0.5 text-rose-500"
                        style={{
                            textShadow: '0 0 5px rgba(244, 63, 94, 0.9), 0 0 10px rgba(225, 29, 72, 0.6)'
                        }}
                    >
                        {englishTag}
                    </span>
                </div>
            );
        };

        // 条子（索）：与筒牌统一在 PatternBox 内均匀分布，完全横平竖直、绝无倾斜
        const TiaoTileView = ({ val, size = "md" }) => {
            if (val === 1) {
                return (
                    <PatternBox size={size}>
                        <div className="flex items-center justify-center w-full h-full">
                            <MinimalLine size={size} length="long" />
                        </div>
                    </PatternBox>
                );
            }
            if (val === 2) {
                return (
                    <PatternBox size={size}>
                        <div className="grid grid-cols-1 grid-rows-2 h-full items-center justify-items-center">
                            <MinimalLine size={size} length="standard" />
                            <MinimalLine size={size} length="standard" />
                        </div>
                    </PatternBox>
                );
            }
            if (val === 3) {
                return (
                    <PatternBox size={size}>
                        <div className="grid grid-cols-1 grid-rows-2 h-full items-center justify-items-center">
                            <MinimalLine size={size} length="standard" />
                            <div className="flex justify-between items-center w-[62%]">
                                <MinimalLine size={size} length="standard" />
                                <MinimalLine size={size} length="standard" />
                            </div>
                        </div>
                    </PatternBox>
                );
            }
            if (val === 4) {
                return (
                    <PatternBox size={size}>
                        <div className="grid grid-cols-1 grid-rows-2 w-[72%] h-full items-center justify-items-center">
                            <div className="flex justify-between items-center w-full">
                                <MinimalLine size={size} length="standard" />
                                <MinimalLine size={size} length="standard" />
                            </div>
                            <div className="flex justify-between items-center w-full">
                                <MinimalLine size={size} length="standard" />
                                <MinimalLine size={size} length="standard" />
                            </div>
                        </div>
                    </PatternBox>
                );
            }
            if (val === 5) {
                return (
                    <PatternBox size={size}>
                        <div className="grid grid-cols-1 grid-rows-3 w-full h-full items-center justify-items-center">
                            <div className="flex justify-between items-center w-[72%]">
                                <MinimalLine size={size} length="short" />
                                <MinimalLine size={size} length="short" />
                            </div>
                            <div className="flex justify-center items-center w-full">
                                <MinimalLine size={size} length="short" />
                            </div>
                            <div className="flex justify-between items-center w-[72%]">
                                <MinimalLine size={size} length="short" />
                                <MinimalLine size={size} length="short" />
                            </div>
                        </div>
                    </PatternBox>
                );
            }
            if (val === 6) {
                return (
                    <PatternBox size={size}>
                        <div className="grid grid-cols-1 grid-rows-2 w-full h-full items-center justify-items-center">
                            <div className="flex justify-between items-center w-[85%]">
                                <MinimalLine size={size} length="standard" />
                                <MinimalLine size={size} length="standard" />

        const generateMahjongDeck = () => {

                for (let n = 1; n <= 9; n++) deck.push({ id: `wan_${n}_${c}`, suit: 'wan', val: n, name: `${CHINESE_NUMS[n]}万` });
                for (let n = 1; n <= 9; n++) deck.push({ id: `tiao_${n}_${c}`, suit: 'tiao', val: n, name: `${n}条` });
                for (let n = 1; n <= 9; n++) deck.push({ id: `tong_${n}_${c}`, suit: 'tong', val: n, name: `${n}筒` });
                for (let n = 1; n <= 7; n++) deck.push({ id: `zi_${n}_${c}`, suit: 'zi', val: n, name: ZI_NAMES[n] });
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

        const isStandardWin = (tiles) => {
            if (tiles.length % 3 !== 2) return false;

            const counts = {};
            tiles.forEach(t => {
                const key = `${t.suit}_${t.val}`;
                counts[key] = (counts[key] || 0) + 1;
            });

            if (tiles.length === 14) {
                const pairKeys = Object.keys(counts).filter(k => counts[k] === 2);
                if (pairKeys.length === 7) return { isWin: true, type: '七对子', fan: 4 };
            }

            const uniqueKeys = Object.keys(counts);
            for (const pairKey of uniqueKeys) {
                if (counts[pairKey] >= 2) {
                    const tempCounts = { ...counts };
                    tempCounts[pairKey] -= 2;

                    if (canDecomposeMelds(tempCounts)) {
                        return { isWin: true, type: '平胡/自摸', fan: 1 };
                    }
                }
            }
            return { isWin: false, fan: 0 };
        };

        const canDecomposeMelds = (counts) => {
            let firstKey = null;
            for (const k of Object.keys(counts).sort()) {
                if (counts[k] > 0) {
                    firstKey = k;
                    break;
                }
            }
            if (!firstKey) return true;

            const [suit, valStr] = firstKey.split('_');
            const val = parseInt(valStr, 10);

            if (counts[firstKey] >= 3) {
                counts[firstKey] -= 3;
                if (canDecomposeMelds(counts)) return true;
                counts[firstKey] += 3;
            }

            if (suit !== 'zi' && val <= 7) {
                const k2 = `${suit}_${val + 1}`;
                const k3 = `${suit}_${val + 2}`;
                if ((counts[k2] || 0) > 0 && (counts[k3] || 0) > 0) {
                    counts[firstKey]--;
                    counts[k2]--;

            const allCandidates = [];

            const counts = {};
            rack.forEach(t => {

                    return score; // 单张为 0
                }

                // 顺子搭子评估
                const hasLeft1 = rack.some(x => x.suit === t.suit && x.val === t.val - 1);
                const hasRight1 = rack.some(x => x.suit === t.suit && x.val === t.val + 1);
                const hasLeft2 = rack.some(x => x.suit === t.suit && x.val === t.val - 2);
                const hasRight2 = rack.some(x => x.suit === t.suit && x.val === t.val + 2);

                if (hasLeft1 && hasRight1) score += 60; // 两头顺 (例 3-4-5)
                if (hasLeft1 || hasRight1) score += 30; // 连号搭子 (例 4-5)
                if (hasLeft2 || hasRight2) score += 15; // 嵌张/边张搭子 (例 3-5)

                // 中张牌 (3~7) 价值高于幺九牌 (1, 9)
                if (t.val >= 3 && t.val <= 7) score += 10;
                else score += 2;

                return score;
            };

            // 找到价值最低的一张牌打出
            let minScore = 9999;
            let bestDiscard = rack[0];

            for (const tile of rack) {
                const val = getTileValue(tile);
                if (val < minScore) {
                    minScore = val;
                    bestDiscard = tile;
                }

        function MahjongGame() {
            const [gameState, setGameState] = useState('home');
            const [selectedCharacter, setSelectedCharacter] = useState('judy');
            const [wall, setWall] = useState([]);
            const [players, setPlayers] = useState([]);
            const [turnIndex, setTurnIndex] = useState(0);
            const [selectedTile, setSelectedTile] = useState(null);
            const [lastDiscardInfo, setLastDiscardInfo] = useState(null);
            
            const [pendingAction, setPendingAction] = useState(null); 
            const [chiOptions, setChiOptions] = useState([]);

            const [showRules, setShowRules] = useState(false);
            const [showLogs, setShowLogs] = useState(false);
            const [logs, setLogs] = useState([]);
            const [roundWinner, setRoundWinner] = useState(null);
            const [tenpaiWaitList, setTenpaiWaitList] = useState([]);
            const [notification, setNotification] = useState(null);

            const aiTimerRef = useRef(null);

            const notify = (msg, type = 'info') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3200);
            };

            const addLog = (msg) => {
                setLogs(prev => [...prev, msg].slice(-50));
            };

            const startNewMatch = () => {
                if (aiTimerRef.current) clearTimeout(aiTimerRef.current);

                const newDeck = generateMahjongDeck();
                const humanProfile = selectedCharacter === 'nick'
                    ? { name: "Nick Wilde", avatar: "🦊" }
                    : { name: "Judy Hopps", avatar: "🐰" };

                const playerRoster = [
                    { id: 0, ...humanProfile, isHuman: true, chips: 25000 },
                    { id: 1, name: selectedCharacter === 'nick' ? "Judy Hopps" : "Nick Wilde", avatar: selectedCharacter === 'nick' ? "🐰" : "🦊", isHuman: false, chips: 25000 },
                    { id: 2, name: "Chief Bogo", avatar: "🐃", isHuman: false, chips: 25000 },
                    { id: 3, name: "Flash Sloth", avatar: "🦥", isHuman: false, chips: 25000 }
                ];

                const initPlayers = playerRoster.map((p, idx) => {
                    const count = idx === 0 ? 14 : 13;
                    const hand = sortMahjongHand(newDeck.splice(0, count));
                    return {
                        ...p,
                        hand,
                        melds: [],
                        discards: [],
                        isTenpai: false
                    };
                });

                setWall(newDeck);
                setPlayers(initPlayers);
                setTurnIndex(0);
                setSelectedTile(null);
                setLastDiscardInfo(null);
                setPendingAction(null);
                setRoundWinner(null);
                setGameState('playing');

                addLog("⚡ 赛博四席落座，初始筹码 25000，136 张量子牌墙部署完毕。");
                notify("牌局开始！你为起手庄家，请点选手牌打出！", "info");
            };

            useEffect(() => {
                if (players.length > 0 && players[0].hand) {
                    const human = players[0];
                    if (human.hand.length % 3 === 1) {
                        const waiting = getTenpaiList(human.hand);
                        setTenpaiWaitList(waiting);
                    } else {
                        setTenpaiWaitList([]);
                    }
                }
            }, [players]);

            const currentPlayer = players[turnIndex] || null;
            const isHumanTurn = currentPlayer && currentPlayer.isHuman && gameState === 'playing';

            const advanceToNextTurn = (nextIdx, currentWall = wall, currentPlayers = players) => {
                if (currentWall.length === 0) {
                    addLog("量子牌墙能量耗尽，荒牌流局！");
                    setRoundWinner({ isDraw: true });
                    setGameState('round_end');
                    return;
                }

                const updatedWall = [...currentWall];
                const drawnTile = updatedWall.pop();

                const updatedPlayers = currentPlayers.map((p, idx) => {
                    if (idx === nextIdx) {
                        return {
                            ...p,
                            hand: [...p.hand, drawnTile]
                        };
                    }
                    return p;
                });

                setWall(updatedWall);
                setPlayers(updatedPlayers);
                setTurnIndex(nextIdx);
                setSelectedTile(null);
                sfx.playDraw();

                const nextPlayer = updatedPlayers[nextIdx];

                const winCheck = isStandardWin(nextPlayer.hand);
                if (winCheck.isWin) {
                    if (nextPlayer.isHuman) {
                        setPendingAction({
                            type: 'tsumo',
                            tile: drawnTile,
                            playerIndex: nextIdx
                        });
                        notify("🎉 绝妙天听，您已自摸！请点击【自摸】完成胜利！", "info");
                        return;
                    } else {
                        handleWinAction(nextIdx, drawnTile, true, updatedPlayers);
                        return;
                    }
                }

                if (!nextPlayer.isHuman) {
                    aiTimerRef.current = setTimeout(() => {
                        handleAIDiscardStep(nextIdx, updatedPlayers, updatedWall);
                    }, 850);
                } else {
                    notify("轮到你的回合，摸入新牌，请点选弃置！", "info");
                }
            };

            const handlePlayerDiscard = (tile) => {
                if (!isHumanTurn) return;

                sfx.playDiscard();
                const newHand = currentPlayer.hand.filter(t => t.id !== tile.id);
                const sortedHand = sortMahjongHand(newHand);
                
                const updatedPlayers = players.map((p, idx) => {
                    if (idx === 0) {
                        return {
                            ...p,
                            hand: sortedHand,
                            discards: [...p.discards, tile]
                        };
                    }
                    return p;
                });

                setPlayers(updatedPlayers);
                setSelectedTile(null);
                setLastDiscardInfo({ playerIndex: 0, tile });
                addLog(`你打出了 【${tile.name}】`);

                checkReactionsToDiscard(0, tile, updatedPlayers, wall);
            };

            const handleAIDiscardStep = (aiIdx, currentPlayers, currentWall) => {
                const ai = currentPlayers[aiIdx];
                const discardTile = evaluateAIDiscard(ai.hand);
                sfx.playDiscard();

                const newHand = sortMahjongHand(ai.hand.filter(t => t.id !== discardTile.id));
                const updatedPlayers = currentPlayers.map((p, idx) => {
                    if (idx === aiIdx) {
                        return {
                            ...p,
                            hand: newHand,
                            discards: [...p.discards, discardTile]
                        };
                    }
                    return p;
                });

                setPlayers(updatedPlayers);
                setLastDiscardInfo({ playerIndex: aiIdx, tile: discardTile });
                addLog(`${ai.name} 打出了 【${discardTile.name}】`);

                checkReactionsToDiscard(aiIdx, discardTile, updatedPlayers, currentWall);
            };

            const checkReactionsToDiscard = (discardPlayerIdx, tile, currentPlayers, currentWall) => {
                const human = currentPlayers[0];

                if (discardPlayerIdx !== 0) {
                    const testHand = [...human.hand, tile];
                    if (isStandardWin(testHand).isWin) {
                        setPendingAction({
                            type: 'ron',
                            tile,
                            fromPlayerIdx: discardPlayerIdx
                        });
                        notify("🔥 敌方放铳！您可以直接点击【荣和胡牌】！", "info");
                        return;
                    }

                    const sameCount = human.hand.filter(t => t.suit === tile.suit && t.val === tile.val).length;
                    const canPeng = sameCount >= 2;
                    const canGang = sameCount === 3;

                    let availableChis = [];
                    if (discardPlayerIdx === 3 && tile.suit !== 'zi') {
                        const v = tile.val;
                        const s = tile.suit;
                        const h = human.hand;
                        const hasVal = (n) => h.some(t => t.suit === s && t.val === n);

                        if (hasVal(v - 2) && hasVal(v - 1)) availableChis.push([v - 2, v - 1, v]);
                        if (hasVal(v - 1) && hasVal(v + 1)) availableChis.push([v - 1, v, v + 1]);
                        if (hasVal(v + 1) && hasVal(v + 2)) availableChis.push([v, v + 1, v + 2]);
                    }

                    if (canPeng || canGang || availableChis.length > 0) {
                        setPendingAction({
                            type: 'prompt',
                            tile,
                            canPeng,
                            canGang,
                            canChi: availableChis.length > 0,
                            chis: availableChis,
                            fromPlayerIdx: discardPlayerIdx
                        });
                        return;
                    }
                }

                // AI 真实荣和判定 (如果他人打出的牌让 AI 胡牌，AI 绝不手软)
                for (let i = 1; i < 4; i++) {
                    if (i !== discardPlayerIdx) {
                        const bot = currentPlayers[i];
                        if (isStandardWin([...bot.hand, tile]).isWin) {
                            handleWinAction(i, tile, false, currentPlayers, discardPlayerIdx);
                            return;
                        }
                    }
                }

                // AI 智能碰牌：当对手打出的牌能让 AI 组成刻子时，AI 有机率执行碰牌
                for (let i = 1; i < 4; i++) {
                    if (i !== discardPlayerIdx) {
                        const bot = currentPlayers[i];
                        const pairMatch = bot.hand.filter(t => t.suit === tile.suit && t.val === tile.val);
                        if (pairMatch.length === 2 && Math.random() > 0.45) {
                            // 执行 AI 碰牌
                            sfx.playMeldAction();
                            const matchIds = new Set(pairMatch.slice(0, 2).map(m => m.id));
                            const remainingHand = bot.hand.filter(t => !matchIds.has(t.id));
                            const newMeld = { type: 'peng', tiles: [...pairMatch.slice(0, 2), tile] };
                            const updatedPlayers = currentPlayers.map((p, idx) => {
                                if (idx === i) {
                                    return { ...p, hand: remainingHand, melds: [...p.melds, newMeld] };
                                }
                                return p;
                            });
                            setPlayers(updatedPlayers);
                            addLog(`🤖 ${bot.name} 【碰】了 【${tile.name}】！`);
                            setTurnIndex(i);
                            aiTimerRef.current = setTimeout(() => {
                                handleAIDiscardStep(i, updatedPlayers, currentWall);
                            }, 750);
                            return;
                        }
                    }
                }

                const nextIdx = (discardPlayerIdx + 1) % 4;
                advanceToNextTurn(nextIdx, currentWall, currentPlayers);

                if (!pendingAction) return;
                const { tile, fromPlayerIdx } = pendingAction;
                sfx.playMeldAction();

                const human = players[0];
                const matching = human.hand.filter(t => t.suit === tile.suit && t.val === tile.val).slice(0, 2);
                const matchIds = new Set(matching.map(m => m.id));

                const remainingHand = human.hand.filter(t => !matchIds.has(t.id));
                const newMeld = {
                    type: 'peng',
                    tiles: [...matching, tile]
                };

                const updatedPlayers = players.map((p, idx) => {
                    if (idx === 0) {
                        return {
                            ...p,
                            hand: remainingHand,
                            melds: [...p.melds, newMeld]
                        };
                    }
                    return p;
                });

                setPlayers(updatedPlayers);
                setPendingAction(null);
                setTurnIndex(0);
                addLog(`你【碰】了 ${players[fromPlayerIdx].name} 的 【${tile.name}】！`);
                notify("碰牌成功！请选择手牌打出一张。", "info");

            const handleChiAction = (chiPattern) => {
                if (!pendingAction) return;
                const { tile } = pendingAction;
                sfx.playMeldAction();

                const human = players[0];
                const neededVals = chiPattern.filter(v => v !== tile.val);
                const usedTiles = [];

                neededVals.forEach(v => {
                    const match = human.hand.find(t => t.suit === tile.suit && t.val === v && !usedTiles.some(u => u.id === t.id));
                    if (match) usedTiles.push(match);
                });

                const usedIds = new Set(usedTiles.map(u => u.id));
                const remainingHand = human.hand.filter(t => !usedIds.has(t.id));
                const newMeld = {
                    type: 'chi',
                    tiles: sortMahjongHand([...usedTiles, tile])
                };

                const updatedPlayers = players.map((p, idx) => {
                    if (idx === 0) {
                        return {
                            ...p,
                            hand: remainingHand,
                            melds: [...p.melds, newMeld]
                        };
                    }
                    return p;
                });

                setPlayers(updatedPlayers);
                setPendingAction(null);
                setChiOptions([]);
                setTurnIndex(0);
                addLog(`你【吃】了 【${tile.name}】！`);
                notify("吃牌成功！请选择手牌打出一张。", "info");
            };

            const handleGangAction = () => {
                if (!pendingAction) return;
                const { tile } = pendingAction;
                sfx.playMeldAction();

                const human = players[0];
                const matching = human.hand.filter(t => t.suit === tile.suit && t.val === tile.val).slice(0, 3);
                const matchIds = new Set(matching.map(m => m.id));

                const newMeld = {
                    type: 'ming_gang',
                    tiles: [...matching, tile]
                };

                if (wall.length === 0) return;
                const updatedWall = [...wall];
                const replacementTile = updatedWall.pop();

                const updatedPlayers = players.map((p, idx) => {
                    if (idx === 0) {
                        return {
                            ...p,
                            hand: [...remainingHand, replacementTile],
                            melds: [...p.melds, newMeld]
                        };
                    }
                    return p;
                });

                setWall(updatedWall);
                setPlayers(updatedPlayers);
                setPendingAction(null);
                setTurnIndex(0);

                                <div className="flex items-center gap-2 border-l border-cyan-900/50 pl-3">
                                    {humanPlayer.melds.map((meld, mIdx) => (
                                        <div key={mIdx} className="flex gap-0.5 bg-black/50 p-1 rounded-lg border border-cyan-900">
                                            {meld.tiles.map(t => (
                                                <MahjongTile key={t.id} tile={t} size="sm" />
                                            ))}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* 胜局结算弹窗 */}
                    {gameState === 'round_end' && roundWinner && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4 safe-top-padding">
                            <div className="bg-slate-900 border-2 border-cyan-500 rounded-3xl p-6 sm:p-8 max-w-lg w-full text-center shadow-[0_0_80px_rgba(0,240,255,0.4)] animate-pop">
                                {roundWinner.isDraw ? (
                                    <>
                                        <div className="text-4xl mb-2">🤝</div>
                                        <h2 className="text-2xl font-black text-cyan-400 mb-2 font-orbitron">荒牌流局！</h2>
                                        <p className="text-xs text-slate-400 mb-6">量子牌墙已耗尽，四方防御均衡，平分秋色。</p>
                                    </>
                                ) : (
                                    <>
                                        <Trophy size={64} className="text-cyan-400 mx-auto mb-2 animate-bounce" />
                                        <h2 className="text-3xl font-black text-white mb-1 font-orbitron">
                                            {roundWinner.winner.name} 【胡牌】！
                                        </h2>
                                        <p className="text-sm font-bold text-cyan-300 mb-4">
                                            {roundWinner.isSelfDraw ? '自摸天成 · 满堂喝彩' : `点炮放铳 · 胜负分明`}
                                        </p>

                                        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-left mb-6 space-y-2">
                                            <div className="text-xs font-bold text-slate-400 uppercase tracking-wider font-orbitron">
                                                番型结算明细
                                            </div>
                                            <div className="flex flex-wrap gap-2 pt-1">
                                                {roundWinner.fanDetails.fans.map((f, i) => (
                                                    <span key={i} className="px-2.5 py-1 rounded-lg bg-cyan-500/20 text-cyan-300 text-xs font-bold border border-cyan-500/30">
                                                        {f.name} ({f.fan}番)
                                                    </span>
                                                ))}
                                            </div>
                                            <div className="flex justify-between items-center pt-2 border-t border-slate-800 text-sm font-black">
                                                <span className="text-slate-300">总番数 / 战果点数：</span>
                                                <span className="text-cyan-400 font-mono text-lg text-glow-cyan">
                                                    {roundWinner.fanDetails.totalFan} 番 / +{roundWinner.fanDetails.score} 筹码
                                                </span>
                                            </div>
                                        </div>
                                    </>
                                )}

                                <div className="flex gap-3">
                                    <button
                                        onClick={startNewMatch}
                                        className="w-full py-3.5 bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 font-black rounded-xl text-base shadow-xl active:scale-95 font-orbitron"
                                    >
                                        再战一局
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MahjongGame />);
    </script>
</body>
</html>
