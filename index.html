<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CyberMahjong">
    <title>麻将 (Mahjong) - 赛博纪元 iPad Pro 12.9" 豪华典藏版</title>

    <!-- Tailwind CSS, Google Fonts, React 18, Babel CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        html, body {
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background-color: #050811;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", sans-serif;
        }

        #root {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .safe-top-padding {
            padding-top: max(env(safe-area-inset-top), 8px);
        }

        .font-orbitron {
            font-family: 'Orbitron', monospace;
        }
        .font-heiti {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", sans-serif;
            font-weight: 900;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(10, 16, 30, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e3a5f;
            border-radius: 4px;
        }

        /* 赛博深空量子战术底桌 */
        .cyber-table-felt {
            background-color: #070d1a;
            background-image: 
                radial-gradient(ellipse at 50% 50%, rgba(14, 53, 90, 0.45) 0%, rgba(4, 8, 16, 0.95) 80%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 28px 28px, 28px 28px;
        }

        /* 纳米骨瓷 3D 麻将牌块 */
        .mj-tile-nano {
            background: linear-gradient(170deg, #ffffff 0%, #f1f5f9 55%, #cbd5e1 100%);
            border-radius: 6px;
            box-shadow: 
                0 1px 0 rgba(255, 255, 255, 0.95) inset,
                0 -2px 0 rgba(15, 23, 42, 0.4) inset,
                -1px 0 0 rgba(255, 255, 255, 0.7) inset,
                1px 0 0 rgba(15, 23, 42, 0.25) inset,
                0 6px 14px -2px rgba(0, 0, 0, 0.75),
                0 3px 5px -1px rgba(0, 0, 0, 0.45);
            border: 1px solid #94a3b8;
            position: relative;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.3, 1), box-shadow 0.15s ease-out;
        }

        /* 牌背墨蓝极光底板 */
        .mj-tile-nano::after {
            content: "";
            position: absolute;
            bottom: -3px;
            left: 1px;
            right: 1px;
            height: 3.5px;
            background: linear-gradient(90deg, #0369a1 0%, #00f0ff 50%, #0284c7 100%);
            border-radius: 0 0 5px 5px;
            border-bottom: 1px solid #082f49;
        }

        .mj-tile-selected {
            transform: translateY(-16px) scale(1.05);
            box-shadow: 
                0 0 0 2px #00f0ff,
                0 0 24px rgba(0, 240, 255, 0.75),
                0 14px 28px -4px rgba(0, 0, 0, 0.85);
            z-index: 30;
        }

        .mj-tile-nano:active {
            transform: translateY(-4px) scale(0.98);
        }

        /* 左右玩家 90 度旋转侧卧牌块 */
        .mj-tile-side-horizontal {
            width: 28px;
            height: 18px;
            background: linear-gradient(180deg, #0c2038 0%, #05101d 70%, #02070e 100%);
            border: 1px solid #0284c7;
            border-right: 3px solid #00f0ff;
            border-radius: 3px;
            box-shadow: 0 1px 0 rgba(0, 240, 255, 0.4) inset, 0 3px 6px rgba(0, 0, 0, 0.8);
            position: relative;
            flex-shrink: 0;
        }

        /* 对家北席牌背 */
        .mj-tile-back-cyber {
            background: linear-gradient(145deg, #0c2038 0%, #05101d 60%, #02070e 100%);
            border: 1px solid #0284c7;
            box-shadow: 0 1px 0 rgba(0, 240, 255, 0.4) inset, 0 4px 8px rgba(0, 0, 0, 0.7);
            border-radius: 6px;
        }

        /* 量子八卦罗盘 */
        .quantum-compass {
            background: radial-gradient(circle at 50% 50%, #0d1e33 0%, #060e19 100%);
            border: 2px solid #00f0ff55;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25), 0 0 12px rgba(0, 0, 0, 0.8) inset;
        }

        @keyframes cyberPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px #00f0ffaa); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 22px #ff0077dd); }
        }
        .cyber-action-pulse {
            animation: cyberPulse 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .text-glow-cyan {
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 240, 255, 0.4);
        }

        /* 汉字细致科技发光描边 */
        .cyber-char-stroke-cyan {
            -webkit-text-stroke: 0.65px rgba(0, 240, 255, 0.8);
            text-shadow: 0 0 4px rgba(0, 240, 255, 0.55), 0 0 10px rgba(0, 240, 255, 0.25);
        }
        .cyber-char-stroke-rose {
            -webkit-text-stroke: 0.65px rgba(244, 63, 94, 0.85);
            text-shadow: 0 0 5px rgba(244, 63, 94, 0.7), 0 0 12px rgba(244, 63, 94, 0.35);
        }
        .cyber-char-stroke-emerald {
            -webkit-text-stroke: 0.65px rgba(16, 185, 129, 0.85);
            text-shadow: 0 0 5px rgba(16, 185, 129, 0.7), 0 0 12px rgba(16, 185, 129, 0.35);
        }

        /* 轮到人类回合时底部主牌架全包围赛博极光高亮呼吸光圈 */
        .active-human-rack {
            border-color: #00f0ff !important;
            box-shadow: 0 -8px 36px rgba(0, 240, 255, 0.45), 0 0 0 1.5px rgba(0, 240, 255, 0.6) inset !important;
        }
    </style>
</head>
<body class="bg-[#050811] text-cyan-50 select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        class CyberMahjongSFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTileClick() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1400, now);
                    osc.frequency.exponentialRampToValueAtTime(360, now + 0.04);
                    gain.gain.setValueAtTime(0.28, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } catch(e) {}
            }
            playDiscard() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
                    gain.gain.setValueAtTime(0.36, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } catch(e) {}
            }
            playDraw() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.linearRampToValueAtTime(880, now + 0.06);
                    gain.gain.setValueAtTime(0.16, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } catch(e) {}
            }
            playMeldAction() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    [587.33, 880, 1174.66].forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.04);
                        gain.gain.setValueAtTime(0.18, now + idx * 0.04);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.04 + 0.08);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.04);
                        osc.stop(now + idx * 0.04 + 0.08);
                    });
                } catch(e) {}
            }
            playVictoryHu() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const chord = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                    chord.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + i * 0.07);
                        gain.gain.setValueAtTime(0.28, now + i * 0.07);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.6);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + i * 0.07);
                        osc.stop(now + i * 0.07 + 0.6);
                    });
                } catch(e) {}
            }
        }
        const sfx = new CyberMahjongSFX();

        const IconBase = ({ children, size = 20, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Cpu = (p) => <IconBase {...p}><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><line x1="9" y1="1" x2="9" y2="4" /><line x1="15" y1="1" x2="15" y2="4" /><line x1="9" y1="20" x2="9" y2="23" /><line x1="15" y1="20" x2="15" y2="23" /><line x1="20" y1="9" x2="23" y2="9" /><line x1="20" y1="14" x2="23" y2="14" /><line x1="1" y1="9" x2="4" y2="9" /><line x1="1" y1="14" x2="4" y2="14" /></IconBase>;
        const Zap = (p) => <IconBase {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></IconBase>;
        const BookOpen = (p) => <IconBase {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></IconBase>;
        const XIcon = (p) => <IconBase {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></IconBase>;
        const MessageSquare = (p) => <IconBase {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></IconBase>;
        const HomeIcon = (p) => <IconBase {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></IconBase>;
        const Sparkles = (p) => <IconBase {...p}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275-1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /></IconBase>;
        const Lightbulb = (p) => <IconBase {...p}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></IconBase>;
        const Trophy = (p) => <IconBase {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" /></IconBase>;

        // 首页高能聚变反应堆专属矢量图
        const ArcReactorSVG = ({ size = "lg" }) => {
            const dim = size === 'sm' ? 24 : size === 'md' ? 44 : 68;
            return (
                <svg width={dim} height={dim} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" className="shrink-0 select-none drop-shadow-[0_0_18px_rgba(0,240,255,0.7)]">
                    {/* 外圈磁感应线圈与高压刻度 */}
                    <circle cx="32" cy="32" r="30" stroke="#00f0ff" strokeWidth="1.5" strokeDasharray="4 2" opacity="0.85" />
                    <circle cx="32" cy="32" r="26" stroke="#0284c7" strokeWidth="3" fill="#061220" />
                    {/* 8方位高能聚变电容电极 */}
                    {Array.from({ length: 8 }).map((_, i) => (
                        <rect 
                            key={i} 
                            x="30" y="7" width="4" height="8" rx="1.5" 
                            fill="#f59e0b" 
                            stroke="#ffffff"
                            strokeWidth="0.6"
                            transform={`rotate(${i * 45} 32 32)`}
                        />
                    ))}
                    {/* 内圈超导磁环 */}
                    <circle cx="32" cy="32" r="16" stroke="#f43f5e" strokeWidth="2.5" fill="#0b1728" />
                    <circle cx="32" cy="32" r="10" fill="#0284c7" />
                    {/* 白热聚变光心 */}
                    <circle cx="32" cy="32" r="5.5" fill="#ffffff" filter="drop-shadow(0 0 8px #00f0ff)" />
                </svg>
            );
        };

        const CHINESE_NUMS = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
        const ZI_NAMES = ["", "东", "南", "西", "北", "中", "发", "白"];

        // 极简纯黑圆角倒角线条（严格保持各级尺寸下的饱满粗细与舒适长度）
        const MinimalLine = ({ size = "md", length = "standard", extraClass = "" }) => {
            const widthClass = {
                sm: "w-[2.6px]",
                river: "w-[3.2px]",
                md: "w-[3.8px]",
                lg: "w-[4.4px]"
            }[size] || "w-[3.8px]";

            const heightClass = {
                long: { sm: "h-[18px]", river: "h-[22px]", md: "h-[26px]", lg: "h-[32px]" },
                standard: { sm: "h-[8.5px]", river: "h-[11px]", md: "h-[13px]", lg: "h-[16px]" },
                short: { sm: "h-[7px]", river: "h-[9px]", md: "h-[10.5px]", lg: "h-[13px]" }
            }[length]?.[size] || { sm: "h-[8.5px]", river: "h-[11px]", md: "h-[13px]", lg: "h-[16px]" }[size];

            return (
                <div 
                    className={`${widthClass} ${heightClass} bg-slate-950 rounded-full shrink-0 select-none shadow-[0_0_2px_rgba(0,240,255,0.6)] ${extraClass}`}
                />
            );
        };

        // 极简纯黑实心小圆圈（适度饱满，绝非芝麻细点）
        const MinimalCircle = ({ size = "md", extraClass = "" }) => {
            const dimClass = {
                sm: "w-[5px] h-[5px]",
                river: "w-[6.5px] h-[6.5px]",
                md: "w-[7.5px] h-[7.5px]",
                lg: "w-[9px] h-[9px]"
            }[size] || "w-[7.5px] h-[7.5px]";

            return (
                <div 
                    className={`${dimClass} bg-slate-950 rounded-full shrink-0 select-none shadow-[0_0_2px_rgba(0,240,255,0.6)] ${extraClass}`}
                />
            );
        };

        // 万字牌：纯正加粗黑体汉字数字（全同色）+ 下方英文赤红荧光
        const WanTileView = ({ val, size = "md" }) => {
            const fontNumSize = {
                sm: "text-base",
                river: "text-xl",
                md: "text-2xl",
                lg: "text-[28px]"
            }[size] || "text-2xl";

            const fontEnSize = {
                sm: "text-[5.5px]",
                river: "text-[6.5px]",
                md: "text-[7.5px]",
                lg: "text-[8.5px]"
            }[size] || "text-[7.5px]";

            return (
                <div className="flex flex-col items-center justify-center leading-none select-none h-full py-0.5">
                    <span className={`font-heiti font-black tracking-tighter text-slate-950 cyber-char-stroke-cyan ${fontNumSize}`}>
                        {CHINESE_NUMS[val]}
                    </span>
                    <span className={`font-orbitron font-extrabold text-rose-500 tracking-wider mt-1 drop-shadow-[0_0_5px_rgba(244,63,94,0.75)] ${fontEnSize}`}>
                        {val} WAN
                    </span>
                </div>
            );
        };

        // 条子（索）：全黑倒角圆角线条，三条舒展工整品字形
        const TiaoTileView = ({ val, size = "md" }) => {
            if (val === 1) {
                return (
                    <div className="flex items-center justify-center h-full w-full">
                        <MinimalLine size={size} length="long" />
                    </div>
                );
            }
            if (val === 2) {
                return (
                    <div className="flex flex-col items-center justify-center gap-2 sm:gap-2.5 h-full py-1">
                        <MinimalLine size={size} length="standard" />
                        <MinimalLine size={size} length="standard" />
                    </div>
                );
            }
            if (val === 3) {
                // 三条重构：上方一根居中，下方两根适度横向展开，上下间距舒适
                return (
                    <div className="flex flex-col items-center justify-center h-full w-full py-1">
                        <MinimalLine size={size} length="standard" extraClass="mb-1.5 sm:mb-2" />
                        <div className="flex items-center justify-center gap-3 sm:gap-4">
                            <MinimalLine size={size} length="standard" />
                            <MinimalLine size={size} length="standard" />
                        </div>
                    </div>
                );
            }
            if (val === 4) {
                return (
                    <div className="flex items-center justify-center gap-3 sm:gap-4 h-full py-1">
                        <div className="flex flex-col gap-1.5 sm:gap-2">
                            <MinimalLine size={size} length="standard" />
                            <MinimalLine size={size} length="standard" />
                        </div>
                        <div className="flex flex-col gap-1.5 sm:gap-2">
                            <MinimalLine size={size} length="standard" />
                            <MinimalLine size={size} length="standard" />
                        </div>
                    </div>
                );
            }
            if (val === 5) {
                return (
                    <div className="flex items-center justify-center gap-2.5 sm:gap-3.5 h-full py-1">
                        <div className="flex flex-col gap-1.5 sm:gap-2">
                            <MinimalLine size={size} length="short" />
                            <MinimalLine size={size} length="short" />
                        </div>
                        <MinimalLine size={size} length="short" />
                        <div className="flex flex-col gap-1.5 sm:gap-2">
                            <MinimalLine size={size} length="short" />
                            <MinimalLine size={size} length="short" />
                        </div>
                    </div>
                );
            }
            if (val === 6) {
                return (
                    <div className="flex items-center justify-center gap-2 sm:gap-2.5 h-full py-1">
                        <div className="flex flex-col gap-1.5 sm:gap-2">
                            <MinimalLine size={size} length="short" />
                            <MinimalLine size={size} length="short" />
                        </div>
                        <div className="flex flex-col gap-1.5 sm:gap-2">
                            <MinimalLine size={size} length="short" />
                            <MinimalLine size={size} length="short" />
                        </div>
                        <div className="flex flex-col gap-1.5 sm:gap-2">
                            <MinimalLine size={size} length="short" />
                            <MinimalLine size={size} length="short" />
                        </div>
                    </div>
                );
            }
            if (val === 7) {
                return (
                    <div className="flex flex-col items-center justify-center gap-1.5 sm:gap-2 h-full py-0.5">
                        <div className="flex items-center gap-2 sm:gap-2.5">
                            <MinimalLine size={size} length="short" />
                            <MinimalLine size={size} length="short" />
                            <MinimalLine size={size} length="short" />
                        </div>
                        <div className="flex items-center gap-1.5 sm:gap-2">
                            <MinimalLine size={size} length="short" />

        const generateMahjongDeck = () => {
            const deck = [];
            for (let c = 0; c < 4; c++) {
                for (let n = 1; n <= 9; n++) deck.push({ id: `wan_${n}_${c}`, suit: 'wan', val: n, name: `${CHINESE_NUMS[n]}万` });
                for (let n = 1; n <= 9; n++) deck.push({ id: `tiao_${n}_${c}`, suit: 'tiao', val: n, name: `${n}条` });
                for (let n = 1; n <= 9; n++) deck.push({ id: `tong_${n}_${c}`, suit: 'tong', val: n, name: `${n}筒` });
                for (let n = 1; n <= 7; n++) deck.push({ id: `zi_${n}_${c}`, suit: 'zi', val: n, name: ZI_NAMES[n] });
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;

        const isStandardWin = (tiles) => {
            if (!tiles || tiles.length % 3 !== 2) return { isWin: false, fan: 0 };

            const counts = {};
            tiles.forEach(t => {
                const key = `${t.suit}_${t.val}`;
                counts[key] = (counts[key] || 0) + 1;
            });

            if (tiles.length === 14) {
                const pairKeys = Object.keys(counts).filter(k => counts[k] === 2);
                if (pairKeys.length === 7) return { isWin: true, type: '七对子', fan: 4 };
            }

            const uniqueKeys = Object.keys(counts);
            for (const pairKey of uniqueKeys) {
                if (counts[pairKey] >= 2) {
                    const tempCounts = { ...counts };
                    tempCounts[pairKey] -= 2;

                    if (canDecomposeMelds(tempCounts)) {
                        return { isWin: true, type: '标准胡牌', fan: 1 };
                    }
                }
            }
            return { isWin: false, fan: 0 };
        };

        const canDecomposeMelds = (counts) => {
            let firstKey = null;
            for (const k of Object.keys(counts).sort()) {
                if (counts[k] > 0) {
                    firstKey = k;
                    break;
                }
            }
            if (!firstKey) return true;

            const [suit, valStr] = firstKey.split('_');
            const val = parseInt(valStr, 10);

            if (counts[firstKey] >= 3) {
                counts[firstKey] -= 3;
                if (canDecomposeMelds(counts)) return true;
                counts[firstKey] += 3;
            }

            if (suit !== 'zi' && val <= 7) {
                const k2 = `${suit}_${val + 1}`;
                const k3 = `${suit}_${val + 2}`;
                if ((counts[k2] || 0) > 0 && (counts[k3] || 0) > 0) {
                    counts[firstKey]--;
                    counts[k2]--;
                    counts[k3]--;
                    if (canDecomposeMelds(counts)) return true;
                    counts[firstKey]++;
                    counts[k2]++;
                    counts[k3]++;
                }
            }
            return false;
        };

        const evaluateFanDetails = (handTiles, melds, winningTile, isSelfDraw) => {
            const allTiles = [...handTiles, ...melds.flatMap(m => m.tiles)];
            const fans = [];

            if (isSelfDraw) fans.push({ name: '自摸', fan: 1 });
            else fans.push({ name: '放铳荣和', fan: 1 });

            if (melds.every(m => m.type === 'an_gang')) {

            const nonZiSuits = new Set(allTiles.filter(t => t.suit !== 'zi').map(t => t.suit));
            const hasZi = allTiles.some(t => t.suit === 'zi');

            if (nonZiSuits.size === 1 && !hasZi) {
                fans.push({ name: '清一色', fan: 6 });
            } else if (nonZiSuits.size === 1 && hasZi) {
                fans.push({ name: '混一色', fan: 3 });
            }

            const isTanyao = allTiles.every(t => t.suit !== 'zi' && t.val >= 2 && t.val <= 8);
            if (isTanyao) fans.push({ name: '断幺九', fan: 1 });

            const counts = {};
            handTiles.forEach(t => {
                const k = `${t.suit}_${t.val}`;
                counts[k] = (counts[k] || 0) + 1;
            });
            const isAllTriplets = Object.values(counts).every(c => c === 3 || c === 2) && melds.every(m => m.type === 'peng' || m.type.includes('gang'));
            if (isAllTriplets && handTiles.length > 2) {
                fans.push({ name: '碰碰胡', fan: 3 });

            const zhongCount = allTiles.filter(t => t.suit === 'zi' && t.val === 5).length;
            const faCount = allTiles.filter(t => t.suit === 'zi' && t.val === 6).length;
            const baiCount = allTiles.filter(t => t.suit === 'zi' && t.val === 7).length;
            if (zhongCount >= 3 && faCount >= 3 && baiCount >= 3) {
                fans.push({ name: '大三元 (满贯)', fan: 8 });
            }

            const totalFan = fans.reduce((acc, f) => acc + f.fan, 0);
            return { fans, totalFan, score: totalFan * 1000 + 1000 };
        };

        const getTenpaiList = (handTiles) => {
            const waitingTiles = [];
            const suits = ['wan', 'tiao', 'tong'];
            const allCandidates = [];

            suits.forEach(suit => {
                for (let v = 1; v <= 9; v++) allCandidates.push({ suit, val: v, name: `${v}${suit === 'wan' ? '万' : suit === 'tiao' ? '条' : '筒'}` });
            });
            for (let v = 1; v <= 7; v++) allCandidates.push({ suit: 'zi', val: v, name: ZI_NAMES[v] });

            for (const cand of allCandidates) {
                const testHand = [...handTiles, cand];

        const sortMahjongHand = (tiles) => {
            const suitOrder = { wan: 1, tiao: 2, tong: 3, zi: 4 };
            return [...tiles].sort((a, b) => {

        const LEAGUE_TIERS = [

            { min: 20000, name: "矩阵雀士", color: "text-cyan-400", border: "border-cyan-400", badge: "ADEPT" },

        const getTierByChips = (chips) => {
            for (let i = LEAGUE_TIERS.length - 1; i >= 0; i--) {

            }
            return LEAGUE_TIERS[0];
        };

        const analyzeTacticalHand = (hand, discards = []) => {
            if (!hand || hand.length % 3 !== 2) return null;

            const seenCounts = {};
            discards.forEach(t => {
                const k = `${t.suit}_${t.val}`;
                seenCounts[k] = (seenCounts[k] || 0) + 1;
            });
            hand.forEach(t => {
                const k = `${t.suit}_${t.val}`;
                seenCounts[k] = (seenCounts[k] || 0) + 1;
            });

            const uniqueCandidates = [];
            const seenIds = new Set();
            hand.forEach(t => {
                const k = `${t.suit}_${t.val}`;
                if (!seenIds.has(k)) {
                    seenIds.add(k);
                    uniqueCandidates.push(t);
                }
            });

            const analysisResults = [];
            const suits = ['wan', 'tiao', 'tong'];
            const allPossibleTiles = [];
            suits.forEach(s => {
                for (let v = 1; v <= 9; v++) allPossibleTiles.push({ suit: s, val: v, name: `${v}${s === 'wan'?'万':s === 'tiao'?'条':'筒'}` });
            });
            for (let v = 1; v <= 7; v++) allPossibleTiles.push({ suit: 'zi', val: v, name: ZI_NAMES[v] });

            uniqueCandidates.forEach(discardTile => {
                const remaining = hand.filter(t => t.id !== discardTile.id);
                const currentTenpai = getTenpaiList(remaining);
                let advanceTiles = [];
                let totalAdvanceCount = 0;

                if (currentTenpai.length > 0) {
                    currentTenpai.forEach(waitTile => {
                        const k = `${waitTile.suit}_${waitTile.val}`;
                        const left = Math.max(0, 4 - (seenCounts[k] || 0));
                        totalAdvanceCount += left;
                        advanceTiles.push({ ...waitTile, leftCount: left });
                    });
                } else {
                    allPossibleTiles.forEach(cand => {
                        const test = [...remaining, cand];
                        const testTenpai = getTenpaiList(test);
                        if (testTenpai.length > 0) {
                            const k = `${cand.suit}_${cand.val}`;
                            const left = Math.max(0, 4 - (seenCounts[k] || 0));
                            if (left > 0) {
                                totalAdvanceCount += left;

                            }
                        }
                    });

                    discard: discardTile,
                    isDirectTenpai: currentTenpai.length > 0,
                    tenpaiList: currentTenpai,
                    advanceTiles: advanceTiles.slice(0, 8),
                    totalAdvanceCount,
                    efficiencyScore: totalAdvanceCount * (currentTenpai.length > 0 ? 3 : 1)
                });
            });

            analysisResults.sort((a, b) => b.efficiencyScore - a.efficiencyScore);
            const bestChoice = analysisResults[0] || null;

            const suitCounts = { wan: 0, tiao: 0, tong: 0, zi: 0 };
            hand.forEach(t => suitCounts[t.suit]++);
            const maxNonZi = Math.max(suitCounts.wan, suitCounts.tiao, suitCounts.tong);
            const pureSuit = Object.keys(suitCounts).find(k => k !== 'zi' && suitCounts[k] === maxNonZi);
            const pureRatio = Math.round((maxNonZi / 14) * 100);

            return {
                bestChoice,
                allResults: analysisResults,
                pureRatio,
                pureSuit: pureSuit === 'wan' ? '万字' : pureSuit === 'tiao' ? '条子' : '筒子'
            };
        };

                                    <div className="flex items-center justify-between">
                                        <span className="font-orbitron font-black text-cyan-300 text-xs flex items-center gap-1.5">
                                            <Sparkles size={14} className="text-cyan-400" />
                                            神之一手 · 智能推荐打法
                                        </span>

                                            </div>
