        function MahjongGame() {
            const [gameState, setGameState] = useState('home');
            const [selectedCharacter, setSelectedCharacter] = useState('judy');
            const [wall, setWall] = useState([]);
            const [players, setPlayers] = useState([]);
            const [turnIndex, setTurnIndex] = useState(0);
            const [selectedTile, setSelectedTile] = useState(null);
            const [lastDiscardInfo, setLastDiscardInfo] = useState(null);
            
            const [pendingAction, setPendingAction] = useState(null); 
            const [chiOptions, setChiOptions] = useState([]);

            const [showRules, setShowRules] = useState(false);
            const [showLogs, setShowLogs] = useState(false);
            const [showBrainModal, setShowBrainModal] = useState(false);
            const [logs, setLogs] = useState([]);
            const [roundWinner, setRoundWinner] = useState(null);
            const [tenpaiWaitList, setTenpaiWaitList] = useState([]);
            const [notification, setNotification] = useState(null);

            // 跨局天梯持久化筹码银行
            const [persistentBank, setPersistentBank] = useState([25000, 25000, 25000, 25000]);

            const aiTimerRef = useRef(null);

            const notify = (msg, type = 'info') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3200);
            };

            const addLog = (msg) => {
                setLogs(prev => [...prev, msg].slice(-50));
            };

            const startNewMatch = () => {
                if (aiTimerRef.current) clearTimeout(aiTimerRef.current);

                const newDeck = generateMahjongDeck();
                const humanProfile = selectedCharacter === 'nick'
                    ? { name: "Nick Wilde", avatar: "🦊" }
                    : { name: "Judy Hopps", avatar: "🐰" };

                const playerRoster = [
                    { id: 0, ...humanProfile, isHuman: true, chips: persistentBank[0] },
                    { id: 1, name: selectedCharacter === 'nick' ? "Judy Hopps" : "Nick Wilde", avatar: selectedCharacter === 'nick' ? "🐰" : "🦊", isHuman: false, chips: persistentBank[1] },
                    { id: 2, name: "Chief Bogo", avatar: "🐃", isHuman: false, chips: persistentBank[2] },
                    { id: 3, name: "Flash Sloth", avatar: "🦥", isHuman: false, chips: persistentBank[3] }
                ];

                const initPlayers = playerRoster.map((p, idx) => {
                    const count = idx === 0 ? 14 : 13;
                    const hand = sortMahjongHand(newDeck.splice(0, count));
                    return {
                        ...p,
                        hand,
                        melds: [],
                        discards: [],
                        isTenpai: false
                    };
                });

                setWall(newDeck);
                setPlayers(initPlayers);
                setTurnIndex(0);
                setSelectedTile(null);
                setLastDiscardInfo(null);
                setPendingAction(null);
                setRoundWinner(null);
                setShowBrainModal(false);
                setGameState('playing');

                addLog("⚡ 赛博四席落座，136 张量子牌墙部署完毕，天梯争霸开始！");
                notify("牌局开始！你为起手庄家，请点选手牌打出！", "info");
            };

            useEffect(() => {
                if (players.length > 0 && players[0].hand) {
                    const human = players[0];
                    if (human.hand.length % 3 === 1) {
                        const waiting = getTenpaiList(human.hand);
                        setTenpaiWaitList(waiting);
                    } else {
                        setTenpaiWaitList([]);
                    }
                }
            }, [players]);

            const currentPlayer = players[turnIndex] || null;
            const isHumanTurn = currentPlayer && currentPlayer.isHuman && gameState === 'playing';

            const advanceToNextTurn = (nextIdx, currentWall = wall, currentPlayers = players) => {
                if (currentWall.length === 0) {
                    addLog("量子牌墙能量耗尽，荒牌流局！");
                    setRoundWinner({ isDraw: true });
                    setGameState('round_end');
                    return;
                }

                const updatedWall = [...currentWall];
                const drawnTile = updatedWall.pop();

                const updatedPlayers = currentPlayers.map((p, idx) => {
                    if (idx === nextIdx) {
                        return {
                            ...p,
                            hand: [...p.hand, drawnTile]
                        };
                    }
                    return p;
                });

                setWall(updatedWall);
                setPlayers(updatedPlayers);
                setTurnIndex(nextIdx);
                setSelectedTile(null);
                sfx.playDraw();

                const nextPlayer = updatedPlayers[nextIdx];
                const winCheck = isStandardWin(nextPlayer.hand);

                if (winCheck.isWin) {
                    if (nextPlayer.isHuman) {
                        setPendingAction({
                            type: 'tsumo',
                            tile: drawnTile,
                            playerIndex: nextIdx
                        });
                        notify("🎉 绝妙天听，您已自摸！请点击【自摸】完成胜利！", "info");
                        return;
                    } else {
                        handleWinAction(nextIdx, drawnTile, true, updatedPlayers);
                        return;
                    }
                }

                if (!nextPlayer.isHuman) {
                    aiTimerRef.current = setTimeout(() => {
                        handleAIDiscardStep(nextIdx, updatedPlayers, updatedWall);
                    }, 850);
                } else {
                    notify("轮到你的回合，摸入新牌，请点选弃置！", "info");
                }
            };

            const handlePlayerDiscard = (tile) => {
                if (!isHumanTurn) return;

                sfx.playDiscard();
                const newHand = currentPlayer.hand.filter(t => t.id !== tile.id);
                const sortedHand = sortMahjongHand(newHand);
                
                const updatedPlayers = players.map((p, idx) => {
                    if (idx === 0) {
                        return {
                            ...p,
                            hand: sortedHand,
                            discards: [...p.discards, tile]
                        };
                    }
                    return p;
                });

                setPlayers(updatedPlayers);
                setSelectedTile(null);
                setLastDiscardInfo({ playerIndex: 0, tile });
                addLog(`你打出了 【${tile.name}】`);

                // 核心修复：优先判定 AI 抓铳放铳，不再包赢
                for (let i = 1; i < 4; i++) {
                    const bot = updatedPlayers[i];
                    if (isStandardWin([...bot.hand, tile]).isWin) {
                        addLog(`💥 放铳！${bot.name} 抓住了你打出的 【${tile.name}】 荣和胡牌！`);
                        handleWinAction(i, tile, false, updatedPlayers, 0);
                        return;
                    }
                }

                checkReactionsToDiscard(0, tile, updatedPlayers, wall);
            };

            const handleAIDiscardStep = (aiIdx, currentPlayers, currentWall) => {
                const ai = currentPlayers[aiIdx];
                const discardTile = evaluateAIDiscard(ai.hand);
                sfx.playDiscard();

                const newHand = sortMahjongHand(ai.hand.filter(t => t.id !== discardTile.id));
                const updatedPlayers = currentPlayers.map((p, idx) => {
                    if (idx === aiIdx) {
                        return {
                            ...p,
                            hand: newHand,
                            discards: [...p.discards, discardTile]
                        };
                    }
                    return p;
                });

                setPlayers(updatedPlayers);
                setLastDiscardInfo({ playerIndex: aiIdx, tile: discardTile });
                addLog(`${ai.name} 打出了 【${discardTile.name}】`);

                checkReactionsToDiscard(aiIdx, discardTile, updatedPlayers, currentWall);
            };

            const checkReactionsToDiscard = (discardPlayerIdx, tile, currentPlayers, currentWall) => {
                const human = currentPlayers[0];

                if (discardPlayerIdx !== 0) {
                    const testHand = [...human.hand, tile];
                    if (isStandardWin(testHand).isWin) {
                        setPendingAction({
                            type: 'ron',
                            tile,
                            fromPlayerIdx: discardPlayerIdx
                        });
                        notify("🔥 敌方放铳！您可以直接点击【荣和胡牌】！", "info");
                        return;
                    }

                    const sameCount = human.hand.filter(t => t.suit === tile.suit && t.val === tile.val).length;
                    const canPeng = sameCount >= 2;
                    const canGang = sameCount === 3;

                    let availableChis = [];
                    if (discardPlayerIdx === 3 && tile.suit !== 'zi') {
                        const v = tile.val;
                        const s = tile.suit;
                        const h = human.hand;
                        const hasVal = (n) => h.some(t => t.suit === s && t.val === n);

                        if (hasVal(v - 2) && hasVal(v - 1)) availableChis.push([v - 2, v - 1, v]);
                        if (hasVal(v - 1) && hasVal(v + 1)) availableChis.push([v - 1, v, v + 1]);
                        if (hasVal(v + 1) && hasVal(v + 2)) availableChis.push([v, v + 1, v + 2]);
                    }

                    if (canPeng || canGang || availableChis.length > 0) {
                        setPendingAction({
                            type: 'prompt',
                            tile,
                            canPeng,
                            canGang,
                            canChi: availableChis.length > 0,
                            chis: availableChis,
                            fromPlayerIdx: discardPlayerIdx
                        });
                        return;
                    }
                }

                for (let i = 1; i < 4; i++) {
                    if (i !== discardPlayerIdx) {
                        const bot = currentPlayers[i];
                        if (isStandardWin([...bot.hand, tile]).isWin) {
                            handleWinAction(i, tile, false, currentPlayers, discardPlayerIdx);
                            return;
                        }
                    }
                }

                const nextIdx = (discardPlayerIdx + 1) % 4;
                advanceToNextTurn(nextIdx, currentWall, currentPlayers);
            };

            const evaluateAIDiscard = (rack) => {
                const counts = {};
                rack.forEach(t => {
                    const k = `${t.suit}_${t.val}`;
                    counts[k] = (counts[k] || 0) + 1;
                });

                const singleZi = rack.find(t => t.suit === 'zi' && counts[`${t.suit}_${t.val}`] === 1);
                if (singleZi) return singleZi;

                const isolatedEdge = rack.find(t => {
                    if (t.suit === 'zi') return false;
                    if (counts[`${t.suit}_${t.val}`] > 1) return false;
                    if (t.val === 1 && !rack.some(x => x.suit === t.suit && (x.val === 2 || x.val === 3))) return true;
                    if (t.val === 9 && !rack.some(x => x.suit === t.suit && (x.val === 8 || x.val === 7))) return true;
                    return false;
                });
                if (isolatedEdge) return isolatedEdge;

                const isolatedNormal = rack.find(t => {
                    if (counts[`${t.suit}_${t.val}`] > 1) return false;
                    const hasNeighbor = rack.some(x => x.suit === t.suit && Math.abs(x.val - t.val) <= 2 && x.id !== t.id);
                    return !hasNeighbor;
                });
                if (isolatedNormal) return isolatedNormal;

                const singles = rack.filter(t => counts[`${t.suit}_${t.val}`] === 1);
                if (singles.length > 0) return singles[0];
                return rack[rack.length - 1];
            };

            const handlePengAction = () => {
                if (!pendingAction) return;
                const { tile, fromPlayerIdx } = pendingAction;
                sfx.playMeldAction();

                const human = players[0];
                const matching = human.hand.filter(t => t.suit === tile.suit && t.val === tile.val).slice(0, 2);
                const matchIds = new Set(matching.map(m => m.id));

                const remainingHand = human.hand.filter(t => !matchIds.has(t.id));
                const newMeld = {
                    type: 'peng',
                    tiles: [...matching, tile]
                };

                const updatedPlayers = players.map((p, idx) => {
                    if (idx === 0) {
                        return {
                            ...p,
                            hand: remainingHand,
                            melds: [...p.melds, newMeld]
                        };
                    }
                    return p;
                });

                setPlayers(updatedPlayers);
                setPendingAction(null);
                setTurnIndex(0);
                addLog(`你【碰】了 ${players[fromPlayerIdx].name} 的 【${tile.name}】！`);
                notify("碰牌成功！请选择手牌打出一张。", "info");
            };

            const handleChiAction = (chiPattern) => {
                if (!pendingAction) return;
                const { tile } = pendingAction;
                sfx.playMeldAction();

                const human = players[0];
                const neededVals = chiPattern.filter(v => v !== tile.val);
                const usedTiles = [];

                neededVals.forEach(v => {
                    const match = human.hand.find(t => t.suit === tile.suit && t.val === v && !usedTiles.some(u => u.id === t.id));
                    if (match) usedTiles.push(match);
                });

                const usedIds = new Set(usedTiles.map(u => u.id));
                const remainingHand = human.hand.filter(t => !usedIds.has(t.id));
                const newMeld = {
                    type: 'chi',
                    tiles: sortMahjongHand([...usedTiles, tile])
                };

                const updatedPlayers = players.map((p, idx) => {
                    if (idx === 0) {
                        return {
                            ...p,
                            hand: remainingHand,
                            melds: [...p.melds, newMeld]
                        };
                    }
                    return p;
                });

                setPlayers(updatedPlayers);
                setPendingAction(null);
                setChiOptions([]);
                setTurnIndex(0);
                addLog(`你【吃】了 【${tile.name}】！`);
                notify("吃牌成功！请选择手牌打出一张。", "info");
            };

            const handleGangAction = () => {
                if (!pendingAction) return;
                const { tile } = pendingAction;
                sfx.playMeldAction();

                const human = players[0];
                const matching = human.hand.filter(t => t.suit === tile.suit && t.val === tile.val).slice(0, 3);
                const matchIds = new Set(matching.map(m => m.id));

                const remainingHand = human.hand.filter(t => !matchIds.has(t.id));
                const newMeld = {
                    type: 'ming_gang',
                    tiles: [...matching, tile]
                };

                if (wall.length === 0) return;
                const updatedWall = [...wall];
                const replacementTile = updatedWall.pop();

                const updatedPlayers = players.map((p, idx) => {
                    if (idx === 0) {
                        return {
                            ...p,
                            hand: [...remainingHand, replacementTile],
                            melds: [...p.melds, newMeld]
                        };
                    }
                    return p;
                });

                setWall(updatedWall);
                setPlayers(updatedPlayers);
                setPendingAction(null);
                setTurnIndex(0);
                addLog(`你【大明杠】了 【${tile.name}】并补摸一张牌！`);
                notify("杠牌成功！已补摸一张手牌。", "info");
            };

            const handlePassAction = () => {
                const lastIdx = pendingAction ? pendingAction.fromPlayerIdx : turnIndex;
                setPendingAction(null);
                setChiOptions([]);
                const nextIdx = (lastIdx + 1) % 4;
                advanceToNextTurn(nextIdx, wall, players);
            };

            const handleWinAction = (winnerIdx, winningTile, isSelfDraw, currentPlayers = players, shooterIdx = null) => {
                sfx.playVictoryHu();
                const winner = currentPlayers[winnerIdx];
                const handForEval = isSelfDraw ? winner.hand : [...winner.hand, winningTile];
                const fanDetails = evaluateFanDetails(handForEval, winner.melds, winningTile, isSelfDraw);

                const baseScore = fanDetails.score;
                const newBank = [...persistentBank];

                if (isSelfDraw) {
                    currentPlayers.forEach((p, idx) => {
                        if (idx !== winnerIdx) {
                            newBank[idx] = Math.max(0, newBank[idx] - baseScore);
                            newBank[winnerIdx] += baseScore;
                        }
                    });
                } else if (shooterIdx !== null) {
                    const totalPay = baseScore * 3;
                    newBank[shooterIdx] = Math.max(0, newBank[shooterIdx] - totalPay);
                    newBank[winnerIdx] += totalPay;
                }

                setPersistentBank(newBank);
                setRoundWinner({
                    winner,
                    winningTile,
                    isSelfDraw,
                    shooter: shooterIdx !== null ? currentPlayers[shooterIdx] : null,
                    fanDetails,
                    updatedBank: newBank
                });

                setGameState('round_end');
                addLog(`🏆 ${winner.name} 荣获胡牌！【${fanDetails.fans.map(f => f.name).join(' + ')}】 共计 ${fanDetails.totalFan} 番！`);
            };

            const handleAutoSortHand = () => {
                sfx.playTileClick();
                const updatedPlayers = [...players];
                updatedPlayers[0].hand = sortMahjongHand(updatedPlayers[0].hand);
                setPlayers(updatedPlayers);
                notify("✨ 手牌已按照【万、条、筒、字】智能理顺！", "info");
            };

            const handleSmartTenpaiHint = () => {
                sfx.playTileClick();
                if (tenpaiWaitList.length > 0) {
                    notify(`💡 听牌诊断：您已听牌！听牌张为：[${tenpaiWaitList.map(t => t.name).join('、')}]`, "info");
                } else {
                    notify("💡 听牌诊断：当前尚未听牌，建议保留对子及联络中张！", "warning");
                }
            };

            if (gameState === 'home') {
                return (
                    <SetupHomeModal 
                        onStartGame={startNewMatch} 
                        onOpenRules={() => setShowRules(true)}
                        character={selectedCharacter}
                        setCharacter={setSelectedCharacter}
                    />
                );
            }

            const humanPlayer = players[0] || { hand: [], melds: [], discards: [] };
            const drawnTileSeparated = humanPlayer.hand.length % 3 === 2 ? humanPlayer.hand[humanPlayer.hand.length - 1] : null;
            const mainHand = drawnTileSeparated ? humanPlayer.hand.slice(0, humanPlayer.hand.length - 1) : humanPlayer.hand;

            return (
                <div className="h-full w-full bg-[#050811] text-cyan-100 flex flex-col overflow-hidden font-sans select-none safe-top-padding">
                    {showRules && <MahjongRulesModal onClose={() => setShowRules(false)} />}
                    {showLogs && <LogModal logs={logs} onClose={() => setShowLogs(false)} />}
                    {showBrainModal && (
                        <TacticalBrainModal
                            hand={humanPlayer.hand}
                            discards={humanPlayer.discards}
                            onClose={() => setShowBrainModal(false)}
                            onSelectDiscard={(tile) => handlePlayerDiscard(tile)}
                        />
                    )}

                    {/* 顶部导航与天梯联赛筹码横条 */}
                    <div className="h-14 py-1.5 bg-slate-950/95 border-b border-cyan-500/30 px-3 sm:px-4 flex items-center justify-between z-30 shrink-0 shadow-lg">
                        <div className="flex items-center gap-2.5">
                            <span className="text-xl">🀄</span>
                            <div>
                                <div className="font-orbitron font-black text-cyan-400 text-sm sm:text-base tracking-wider leading-none text-glow-cyan">
                                    CYBER MAHJONG
                                </div>
                                <div className="text-[10px] text-cyan-300/70 font-mono font-bold leading-none mt-1">
                                    天梯争霸 · iPad Pro 12.9"
                                </div>
                            </div>
                        </div>

                        <div className="flex items-center gap-2 overflow-x-auto custom-scrollbar px-2">
                            {players.map((p, idx) => {
                                const tier = getTierByChips(persistentBank[idx] || 25000);
                                return (
                                    <div
                                        key={p.id}
                                        className={`flex items-center gap-1.5 px-2.5 py-1 rounded-xl border text-xs whitespace-nowrap transition-all ${
                                            idx === turnIndex 
                                                ? 'bg-cyan-500/20 border-cyan-400 text-cyan-200 ring-2 ring-cyan-400/40 font-bold' 
                                                : 'bg-slate-900/80 border-slate-800 text-slate-400'
                                        }`}
                                    >
                                        <span>{p.avatar}</span>
                                        <span className="font-bold">{p.name}</span>
                                        <span className={`text-[9px] font-mono px-1 rounded ${tier.color} bg-black/60 border ${tier.border}`}>
                                            {tier.badge}
                                        </span>
                                        <span className="font-mono text-cyan-300 font-bold text-[11px] bg-slate-950 px-1.5 rounded border border-cyan-500/30">
                                            {persistentBank[idx]}
                                        </span>
                                    </div>
                                );
                            })}
                        </div>

                        <div className="flex items-center gap-1.5 shrink-0">
                            <button
                                onClick={() => setShowLogs(true)}
                                className="flex items-center gap-1 px-2.5 py-1 bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-xl text-xs font-bold text-slate-200"
                            >
                                <MessageSquare size={13} className="text-cyan-400" />
                                <span>日志</span>
                            </button>
                            <button
                                onClick={() => setShowRules(true)}
                                className="flex items-center gap-1 px-2.5 py-1 bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-500/40 rounded-xl text-xs font-bold text-cyan-300"
                            >
                                <BookOpen size={13} />
                                <span>规则</span>
                            </button>
                            <button
                                onClick={() => setGameState('home')}
                                className="flex items-center gap-1 px-2.5 py-1 bg-rose-950/60 hover:bg-rose-900 border border-rose-800/80 rounded-xl text-xs font-bold text-rose-300"
                            >
                                <HomeIcon size={13} />
                                <span>主页</span>
                            </button>
                        </div>
                    </div>

                    {/* 赛博桌台主体区域 */}
                    <div className="flex-1 flex flex-col p-2 sm:p-2.5 overflow-hidden relative cyber-table-felt min-h-0">
                        {notification && (
                            <div className="absolute top-3 left-1/2 -translate-x-1/2 z-40 animate-pop pointer-events-none">
                                <div className={`px-4 py-1.5 rounded-full shadow-2xl border text-xs font-bold flex items-center gap-2 backdrop-blur-md whitespace-nowrap ${
                                    notification.type === 'warning' ? 'bg-amber-950/95 border-amber-400 text-amber-200' :
                                    notification.type === 'error' ? 'bg-rose-950/95 border-rose-500 text-rose-200' :
                                    'bg-slate-950/95 border-cyan-400 text-cyan-300 shadow-[0_0_15px_rgba(0,240,255,0.4)]'
                                }`}>
                                    <Sparkles size={14} className="text-cyan-400" />
                                    <span>{notification.msg}</span>
                                </div>
                            </div>
                        )}

                        {/* 北席 (Chief Bogo) */}
                        <div className="flex flex-col items-center justify-center shrink-0 mb-1">
                            <div className="flex items-center gap-2 mb-1">
                                <span className="text-base leading-none">🐃</span>
                                <span className="text-xs font-bold text-slate-300 font-orbitron">Chief Bogo · 北席</span>
                                <span className="text-[10px] text-cyan-400 bg-cyan-950 px-1.5 rounded border border-cyan-500/30">
                                    手牌: {players[2]?.hand.length}
                                </span>
                            </div>
                            <div className="flex gap-1 overflow-hidden">
                                {Array.from({ length: players[2]?.hand.length || 13 }).map((_, i) => (
                                    <MahjongTile key={i} tile={{}} size="sm" faceDown={true} />
                                ))}
                            </div>
                        </div>

                        {/* 中间层：西家 (Flash)、中心大号牌池与量子罗盘、东家 (Judy/Nick) */}
                        <div className="flex-1 flex items-center justify-between px-1 sm:px-2 min-h-0 w-full">
                            {/* 西席单列卧倒牌架 */}
                            <div className="flex flex-col items-center justify-center shrink-0 w-12 sm:w-14">
                                <div className="text-[11px] font-bold text-slate-300 mb-1 flex items-center gap-1 font-orbitron">
                                    <span>🦥</span>
                                    <span>西</span>
                                </div>
                                <div className="flex flex-col gap-0.5 sm:gap-1 items-center">
                                    {Array.from({ length: Math.min(players[3]?.hand.length || 13, 13) }).map((_, i) => (
                                        <div key={i} className="mj-tile-side-horizontal" />
                                    ))}
                                </div>
                            </div>

                            {/* 牌池与中央罗盘（彻底净化，无“（你）”） */}
                            <div className="flex-1 flex flex-col items-center justify-center gap-2 max-w-[940px] mx-auto w-full">
                                <DiscardRiver 
                                    discards={players[2]?.discards || []} 
                                    lastDiscardId={lastDiscardInfo?.tile?.id}
                                    label="北席弃牌池" 
                                />

                                <div className="flex items-center justify-center gap-3 sm:gap-6 w-full">
                                    <DiscardRiver 
                                        discards={players[3]?.discards || []} 
                                        lastDiscardId={lastDiscardInfo?.tile?.id} 
                                        label="西席弃牌池" 
                                    />

                                    <QuantumCompass 
                                        activeTurnIndex={turnIndex} 
                                        wallCount={wall.length} 
                                    />

                                    <DiscardRiver 
                                        discards={players[1]?.discards || []} 
                                        lastDiscardId={lastDiscardInfo?.tile?.id} 
                                        label="东席弃牌池" 
                                    />
                                </div>

                                <DiscardRiver 
                                    discards={players[0]?.discards || []} 
                                    lastDiscardId={lastDiscardInfo?.tile?.id} 
                                    label="南席弃牌池" 
                                />
                            </div>

                            {/* 东席单列卧倒牌架 */}
                            <div className="flex flex-col items-center justify-center shrink-0 w-12 sm:w-14">
                                <div className="text-[11px] font-bold text-slate-300 mb-1 flex items-center gap-1 font-orbitron">
                                    <span>{players[1]?.avatar}</span>
                                    <span>东</span>
                                </div>
                                <div className="flex flex-col gap-0.5 sm:gap-1 items-center">
                                    {Array.from({ length: Math.min(players[1]?.hand.length || 13, 13) }).map((_, i) => (
                                        <div key={i} className="mj-tile-side-horizontal" />
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* 鸣牌响应动作条 (吃/碰/杠/胡) */}
                        {pendingAction && (
                            <div className="absolute bottom-28 sm:bottom-32 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 bg-slate-950/95 border-2 border-cyan-400 p-2.5 rounded-2xl shadow-[0_0_40px_rgba(0,240,255,0.5)] animate-pop backdrop-blur-md">
                                {pendingAction.type === 'tsumo' && (
                                    <button
                                        onClick={() => handleWinAction(0, pendingAction.tile, true)}
                                        className="cyber-action-pulse px-6 py-2.5 bg-gradient-to-r from-rose-600 via-amber-500 to-rose-600 text-white font-black text-lg rounded-xl shadow-xl border border-yellow-200"
                                    >
                                        🏆 自摸胡牌！
                                    </button>
                                )}

                                {pendingAction.type === 'ron' && (
                                    <button
                                        onClick={() => handleWinAction(0, pendingAction.tile, false, players, pendingAction.fromPlayerIdx)}
                                        className="cyber-action-pulse px-6 py-2.5 bg-gradient-to-r from-rose-600 via-amber-500 to-rose-600 text-white font-black text-lg rounded-xl shadow-xl border border-yellow-200"
                                    >
                                        🔥 荣和胡牌！
                                    </button>
                                )}

                                {pendingAction.canPeng && (
                                    <button
                                        onClick={handlePengAction}
                                        className="px-5 py-2 bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-black text-base rounded-xl shadow active:scale-95 border border-cyan-300"
                                    >
                                        碰
                                    </button>
                                )}

                                {pendingAction.canGang && (
                                    <button
                                        onClick={handleGangAction}
                                        className="px-5 py-2 bg-gradient-to-r from-purple-600 to-violet-600 text-white font-black text-base rounded-xl shadow active:scale-95 border border-purple-300"
                                    >
                                        杠
                                    </button>
                                )}

                                {pendingAction.canChi && chiOptions.length === 0 && (
                                    <button
                                        onClick={() => {
                                            if (pendingAction.chis.length === 1) {
                                                handleChiAction(pendingAction.chis[0]);
                                            } else {
                                                setChiOptions(pendingAction.chis);
                                            }
                                        }}
                                        className="px-5 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-black text-base rounded-xl shadow active:scale-95 border border-emerald-300"
                                    >
                                        吃
                                    </button>
                                )}

                                {chiOptions.length > 0 && (
                                    <div className="flex gap-2 bg-slate-900 p-1.5 rounded-xl border border-cyan-500">
                                        {chiOptions.map((opt, i) => (
                                            <button
                                                key={i}
                                                onClick={() => handleChiAction(opt)}
                                                className="px-3 py-1.5 bg-cyan-700 hover:bg-cyan-600 text-white font-bold text-xs rounded-lg shadow"
                                            >
                                                {opt.join('-')}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                <button
                                    onClick={handlePassAction}
                                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-base rounded-xl active:scale-95 border border-slate-600"
                                >
                                    过
                                </button>
                            </div>
                        )}
                    </div>

                    {/* 底部玩家主手牌架（轮到你时全包围极光呼吸高亮，彻底去除“(你)”） */}
                    <div className={`bg-[#030914] border-t-2 ${isHumanTurn ? 'active-human-rack' : 'border-cyan-500/40'} p-2 sm:p-3 shrink-0 flex flex-col z-30 shadow-[0_-8px_30px_rgba(0,0,0,0.85)] transition-all duration-300`}>
                        <div className="flex items-center justify-between px-2 mb-1.5">
                            <div className="flex items-center gap-2">
                                <span className="text-xl">{humanPlayer.avatar}</span>
                                <span className="font-orbitron font-black text-sm text-cyan-300">
                                    {humanPlayer.name} · 南席
                                </span>
                                {isHumanTurn && (
                                    <span className="px-2 py-0.5 rounded-full text-[10px] font-black bg-cyan-400 text-slate-950 animate-pulse font-mono shadow-[0_0_10px_#00f0ff]">
                                        ⚡ 你的回合 · 请打牌
                                    </span>
                                )}
                                {tenpaiWaitList.length > 0 ? (
                                    <span className="text-[11px] font-bold text-cyan-300 bg-cyan-950 px-2 py-0.5 rounded-full border border-cyan-400 animate-pulse shadow-[0_0_8px_#00f0ff]">
                                        ✦ 已听牌: {tenpaiWaitList.map(t => t.name).join(' ')}
                                    </span>
                                ) : null}
                            </div>

                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => setShowBrainModal(true)}
                                    className="px-2.5 py-1 bg-gradient-to-r from-amber-500/20 to-orange-500/20 hover:from-amber-500/30 hover:to-orange-500/30 text-amber-300 border border-amber-400/50 rounded-lg text-xs font-black flex items-center gap-1 active:scale-95 shadow-[0_0_12px_rgba(245,158,11,0.2)]"
                                >
                                    <Cpu size={13} className="text-amber-400" />
                                    <span>战术脑机</span>
                                </button>
                                <button
                                    onClick={handleSmartTenpaiHint}
                                    className="px-2.5 py-1 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 rounded-lg text-xs font-bold flex items-center gap-1 active:scale-95"
                                >
                                    <Lightbulb size={13} />
                                    <span>听牌提示</span>
                                </button>
                                <button
                                    onClick={handleAutoSortHand}
                                    className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-lg text-xs font-bold flex items-center gap-1 active:scale-95"
                                >
                                    <span>理牌</span>
                                </button>
                                {selectedTile && isHumanTurn && (
                                    <button
                                        onClick={() => handlePlayerDiscard(selectedTile)}
                                        className="px-4 py-1 bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 font-black rounded-lg text-xs shadow-lg active:scale-95 border border-cyan-200 animate-pop"
                                    >
                                        打出 【{selectedTile.name}】
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* 手牌展示排布 */}
                        <div className="flex items-end justify-between gap-3 overflow-x-auto custom-scrollbar pt-2 pb-1">
                            <div className="flex items-end gap-1 sm:gap-1.5 flex-1 min-h-[72px]">
                                {mainHand.map(tile => (
                                    <MahjongTile
                                        key={tile.id}
                                        tile={tile}
                                        size="lg"
                                        isSelected={selectedTile?.id === tile.id}
                                        onClick={() => {
                                            sfx.playTileClick();
                                            if (selectedTile?.id === tile.id && isHumanTurn) {
                                                handlePlayerDiscard(tile);
                                            } else {
                                                setSelectedTile(tile);
                                            }
                                        }}
                                    />
                                ))}

                                {drawnTileSeparated && (
                                    <div className="ml-4 flex items-end">
                                        <MahjongTile
                                            tile={drawnTileSeparated}
                                            size="lg"
                                            isDrawn={true}
                                            isSelected={selectedTile?.id === drawnTileSeparated.id}
                                            onClick={() => {
                                                sfx.playTileClick();
                                                if (selectedTile?.id === drawnTileSeparated.id && isHumanTurn) {
                                                    handlePlayerDiscard(drawnTileSeparated);
                                                } else {
                                                    setSelectedTile(drawnTileSeparated);
                                                }
                                            }}
                                        />
                                    </div>
                                )}
                            </div>

                            {humanPlayer.melds.length > 0 && (
                                <div className="flex items-center gap-2 border-l border-cyan-900/50 pl-3">
                                    {humanPlayer.melds.map((meld, mIdx) => (
                                        <div key={mIdx} className="flex gap-0.5 bg-black/50 p-1 rounded-lg border border-cyan-900">
                                            {meld.tiles.map(t => (
                                                <MahjongTile key={t.id} tile={t} size="sm" />
                                            ))}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* 胜局结算弹窗 */}
                    {gameState === 'round_end' && roundWinner && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4 safe-top-padding">
                            <div className="bg-slate-900 border-2 border-cyan-500 rounded-3xl p-6 sm:p-8 max-w-lg w-full text-center shadow-[0_0_80px_rgba(0,240,255,0.4)] animate-pop">
                                {roundWinner.isDraw ? (
                                    <>
                                        <div className="text-4xl mb-2">🤝</div>
                                        <h2 className="text-2xl font-black text-cyan-400 mb-2 font-orbitron">荒牌流局！</h2>
                                        <p className="text-xs text-slate-400 mb-6">量子牌墙已耗尽，四方防御均衡，筹码无变动。</p>
                                    </>
                                ) : (
                                    <>
                                        <Trophy size={64} className="text-cyan-400 mx-auto mb-2 animate-bounce" />
                                        <h2 className="text-3xl font-black text-white mb-1 font-orbitron">
                                            {roundWinner.winner.name} 【胡牌】！
                                        </h2>
                                        <p className="text-sm font-bold text-cyan-300 mb-4">
                                            {roundWinner.isSelfDraw ? '自摸天成 · 三家分摊支付' : `${roundWinner.shooter?.name || '对手'} 点炮放铳 · 全额赔付`}
                                        </p>

                                        <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-left mb-6 space-y-2.5">
                                            <div className="text-xs font-bold text-slate-400 uppercase tracking-wider font-orbitron">
                                                番型结算明细
                                            </div>
                                            <div className="flex flex-wrap gap-2 pt-1">
                                                {roundWinner.fanDetails.fans.map((f, i) => (
                                                    <span key={i} className="px-2.5 py-1 rounded-lg bg-cyan-500/20 text-cyan-300 text-xs font-bold border border-cyan-500/30">
                                                        {f.name} ({f.fan}番)
                                                    </span>
                                                ))}
                                            </div>
                                            <div className="flex justify-between items-center pt-2 border-t border-slate-800 text-sm font-black">
                                                <span className="text-slate-300">本局筹码流转：</span>
                                                <span className="text-emerald-400 font-mono text-base">
                                                    +{roundWinner.fanDetails.score * 3} 筹码
                                                </span>
                                            </div>
                                        </div>
                                    </>
                                )}

                                <div className="flex gap-3">
                                    <button
                                        onClick={startNewMatch}
                                        className="w-full py-3.5 bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 font-black rounded-xl text-base shadow-xl active:scale-95 font-orbitron"
                                    >
                                        继承筹码 · 再战一局
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MahjongGame />);
    </script>
</body>
</html>
